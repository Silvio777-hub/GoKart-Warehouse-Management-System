services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: swam_db
      POSTGRES_USER: swam
      POSTGRES_PASSWORD: swam_pass

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/swam_db
      SPRING_DATASOURCE_USERNAME: swam
      SPRING_DATASOURCE_PASSWORD: swam_pass
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

  e2e-runner:
    image: mcr.microsoft.com/playwright:v1.41.2-jammy
    volumes:
      - ./frontend:/app
    working_dir: /app
    environment:
      - PLAYWRIGHT_JSON_OUTPUT_NAME=results.json
    command: npx playwright test
    depends_on:
      frontend:
        condition: service_healthy
