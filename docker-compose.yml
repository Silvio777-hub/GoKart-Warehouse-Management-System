services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: swam_db
      POSTGRES_USER: swam
      POSTGRES_PASSWORD: swam_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U swam -d swam_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/swam_db
      SPRING_DATASOURCE_USERNAME: swam
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-swam_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-gokartwarehouse_super_secret_key_2024_dont_share_this}
    ports:
      - '8081:8081'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/api/auth/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db_data:
